<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prise de commande - VELUTO</title>
    <link rel="stylesheet" href="css/StylePamela.css">
</head>

<body>


    
<header class="barre-haut">

    <div class="logo">
        <img src="../img/logo-removebg.png" alt="">
    </div>

    <div class="liens-page">
        <a href="../index.html">Accueil</a>
        <a href="../HTML/apropos">À propos</a>
        <a href="../HTML/menu.html">Menu</a>
        <a href="../HTML/restaurent">Restaurant</a>
        <a href="../HTML/reservation.html">Réservation</a>
        <a href="../HTML/commande.html">Commande</a>
    </div>

</header>



<main>

    <section class="menu-title">
        <h1>PRISE DE COMMANDE</h1>
        <p>Interface du serveur pour prendre les commandes des clients.</p>
    </section>

    <section class="menu-form">
        <h2>Nouvelle commande</h2>

        <form id="formCommande">

            <div class="input-group">
                <label for="id_commande">Numéro de commande</label>
                <input type="number" id="id_commande" required>
            </div>

            <div class="input-group">
                <label for="numero_table">Numéro de table</label>
                <input type="number" id="numero_table" required>
            </div>

        
            <button type="submit">Enregistrer la commande</button>

        </form>

        <p id="messageCommande"></p>
    </section>

    <section class="menu-table-section">
        <h2>Commandes en cours</h2>

        <table>
            <thead>
                <tr>
                    <th>Commande</th>
                    <th>Table</th>
                    <th>Client</th>
                    <th>Restaurant</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="tableCommande">
            </tbody>
        </table>
    </section>

</main>

<script src="js/api.js"></script>
<script src="js/commande.js"></script>

</body>
</html>
