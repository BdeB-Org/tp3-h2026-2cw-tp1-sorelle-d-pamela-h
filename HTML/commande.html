 <header class="barre-haut">

    <header>
    <h1>Gestion des commandes</h1>
 
</header>
 
 
<body>
 
 
<main>
 
    <section>
        <h2>Ajouter une commande</h2>
 
        <form id="formCommande">
 
            <label>ID commande</label>
            <input type="number" id="id_commande" required>
 
            <label>Prix</label>
            <input type="number" id="prix" step="0.01" required>
 
            <label>Adresse livraison / numéro de table</label>
            <input type="text" id="adresse_livraison" required>
 
            <label>ID client</label>
            <input type="number" id="client_id_client" required>
 
            <label>ID restaurant</label>
            <input type="number" id="restaurent_id_restaurent" required>
 
            <button type="submit">Ajouter</button>
 
        </form>
 
        <p id="messageCommande"></p>
    </section>
 
    <section>
        <h2>Liste des commandes</h2>
 
        <table border="1">
            <thead>
                <tr>
                    <th>ID commande</th>
                    <th>Prix</th>
                    <th>Adresse livraison</th>
                    <th>ID client</th>
                    <th>ID restaurant</th>
                    <th>Action</th>
                </tr>
            </thead>
 
            <tbody id="tableCommande"></tbody>
        </table>
    </section>
 
</main>
 
<script src="../js/api.js"></script>
<script src="../js/commande.js"></script>
 
</body>
</html>
